server:
  port: 8017 # Puerto local del microservicio de seguridad

spring:
  application:
    name: security

# Configuración del Cliente Eureka (Registro de Microservicios)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Configuración de Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true