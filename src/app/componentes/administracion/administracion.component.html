<div class="container mt-4">
  <h2 class="text-primary mb-3">Gestión de Personal</h2>

  <div *ngIf="mensaje" class="alert alert-danger">
    {{ mensaje }}
  </div>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="card p-3 bg-light mb-4 shadow-sm" style="max-width: 400px;">
    <div class="mb-3">
      <label class="form-label fw-bold">Nombre:</label>
      <input class="form-control" formControlName="nombre" [class.is-invalid]="invalido('nombre')">
    </div>

<div class="mb-3">
  <label class="form-label fw-bold">Apellido:</label>
  <input class="form-control" formControlName="apellido" [class.is-invalid]="invalido('apellido')">
</div>

<div class="mb-3">
  <label class="form-label fw-bold">Email:</label>
  <input class="form-control" type="email" formControlName="email" [class.is-invalid]="invalido('email')">
  <div class="invalid-feedback">Email no válido</div>
</div>

<div class="mb-3">
  <label class="form-label fw-bold">Cargo:</label>
  <select class="form-select" formControlName="cargo" [class.is-invalid]="invalido('cargo')">
    <option value="">Seleccionar cargo</option>
    <option value="DIRECTOR">DIRECTOR</option>
    <option value="VICEDIRECTOR">VICEDIRECTOR</option>
    <option value="SECRETARIO">SECRETARIO</option>
    <option value="PRECEPTOR">PRECEPTOR</option>
    <option value="DOCENTE">DOCENTE</option>
    <option value="ADMINISTRATIVO">ADMINISTRATIVO</option>
  </select>
</div>

<button type="submit" class="btn btn-primary w-100">Guardar Personal</button>

  </form>

  <h3 class="h4 text-secondary mb-3">Listado de Personal</h3>

  <div *ngIf="personal.length > 0; else sinPersonal" class="table-responsive">
    <table class="table table-striped table-hover border">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Email</th>
          <th>Cargo</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of personal">
          <td>{{ p.id }}</td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.apellido }}</td>
          <td>{{ p.email }}</td>
          <td>{{ p.cargo }}</td>
        </tr>
      </tbody>
    </table>
  </div>

<ng-template #sinPersonal> <div class="alert alert-info">No hay personal registrado aún.</div> </ng-template>

</div>
