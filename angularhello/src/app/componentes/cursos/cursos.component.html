<div class="container mt-4">
  <h2 class="text-primary mb-3">Gestión de Cursos</h2>
  <div *ngIf="mensaje" class="alert alert-danger">
    {{ mensaje }}
  </div>
  <form [formGroup]="form" (ngSubmit)="guardar()" class="card p-3 bg-light mb-4 shadow-sm" style="max-width: 400px;">
    <div class="mb-3">
      <label class="form-label fw-bold">Ciclo lectivo:</label>
      <input type="number" class="form-control" formControlName="ciclo_lectivo" [class.is-invalid]="invalido('ciclo_lectivo')">
    </div>
<div class="mb-3">
  <label class="form-label fw-bold">Grado:</label>
  <input class="form-control" formControlName="grado" [class.is-invalid]="invalido('grado')">
</div>
<div class="mb-3">
  <label class="form-label fw-bold">División:</label>
  <input class="form-control" formControlName="division" [class.is-invalid]="invalido('division')">
</div>
<div class="mb-3">
  <label class="form-label fw-bold">Turno:</label>
  <select class="form-select" formControlName="turno" [class.is-invalid]="invalido('turno')">
    <option value="">Seleccionar turno</option>
    <option value="MAÑANA">MAÑANA</option>
    <option value="TARDE">TARDE</option>
    <option value="NOCHE">NOCHE</option>
  </select>
</div>
<div class="mb-3">
  <label class="form-label fw-bold">Cupo máximo:</label>
  <input type="number" class="form-control" formControlName="cupo_maximo" [class.is-invalid]="invalido('cupo_maximo')">
</div>
<button type="submit" class="btn btn-primary w-100">Guardar Curso</button>
  </form>

  <h3 class="h4 text-secondary mb-3">Listado de Cursos</h3>

  <div *ngIf="cursos.length > 0; else sinCursos" class="table-responsive">
    <table class="table table-striped table-hover border">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Ciclo</th>
          <th>Grado</th>
          <th>División</th>
          <th>Turno</th>
          <th>Cupo</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of cursos">
          <td>{{ c.id }}</td>
          <td>{{ c.ciclo_lectivo }}</td>
          <td>{{ c.grado }}</td>
          <td>{{ c.division }}</td>
          <td>{{ c.turno }}</td>
          <td>{{ c.cupo_maximo }}</td>
        </tr>
      </tbody>
    </table>
  </div>
<ng-template #sinCursos> <div class="alert alert-info">No hay cursos registrados aún.</div> </ng-template>
</div>
